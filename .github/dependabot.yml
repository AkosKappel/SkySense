version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (2026-11-12); drop this once it does.
      - dependency-name: typescript
        versions: ['>=7']
      # The types follow the Node major the app runs on (Node 24 on Vercel and in CI).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-check
          - '@sveltejs/*'
          - eslint-plugin-svelte
          - prettier-plugin-svelte
          - vitest-browser-svelte
      tooling:
        patterns:
          - '@types/node'
          - typescript
          - typescript-eslint
          - vite
          - vitest
          - '@vitest/*'
          - tailwindcss
          - '@tailwindcss/vite'
          - '@playwright/test'
          - playwright
      everything-else:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
